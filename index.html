<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 允许搜索引擎索引，但声明不想被用于 AI 训练 -->
    <meta name="robots" content="index, follow, noai, noimageai">
    <title>Go Away — Dummi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Times New Roman", Times, serif;
            background: #0a0a0a;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
        }

        .intro {
            font-size: 1.4rem;
            color: #a0a0a0;
            margin-bottom: 1.5rem;
            letter-spacing: 0.02em;
        }

        .intro .brand {
            color: #ffffff;
            font-weight: bold;
            font-style: italic;
        }

        .hello {
            font-size: 5rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.01em;
            line-height: 1.2;
            margin-top: 0.5rem;
        }

        .bot-hello {
            font-size: 5rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.01em;
            line-height: 1.2;
            margin-top: 0.5rem;
            font-style: italic;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 1em;
            background: #ffffff;
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 1s steps(2) infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        footer {
            position: fixed;
            bottom: 1.5rem;
            font-size: 0.85rem;
            color: #555;
        }

        footer a {
            color: #888;
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: #ccc;
        }

        @media (max-width: 600px) {
            .hello, .bot-hello {
                font-size: 3.2rem;
            }
            .intro {
                font-size: 1.1rem;
            }
        }
    </style>
    <!--
        核心修复：
        1. bot-layer 默认显示，human-layer 默认隐藏
        2. 脚本在 <head> 中立即执行，避免页面闪烁（FOUC）
        3. 只有检测到人类浏览器或搜索引擎时，才切回人类内容
        4. AI 训练爬虫（不执行 JS）会保持看到 bot-layer
    -->
    <script>
        (function() {
            var ua = navigator.userAgent;

            // AI 爬虫黑名单
            var aiBots = [
                /ChatGPT-User/i,
                /GPTBot/i,
                /OAI-SearchBot/i,
                /ClaudeBot/i,
                /anthropic-ai/i,
                /CCBot/i,
                /PerplexityBot/i,
                /Applebot-Extended/i,
                /Bytespider/i,
                /Amazonbot/i,
                /FacebookBot/i,
                /YouBot/i,
                /Diffbot/i,
                /ImagesiftBot/i,
                /cohere-ai/i,
                /omgili/i,
                /Webzio/i
            ];

            // 搜索引擎白名单（优先匹配）
            var searchBots = [
                /Googlebot/i,
                /Bingbot/i,
                /Slurp/i,
                /DuckDuckBot/i,
                /Baiduspider/i,
                /YandexBot/i,
                /Sogou/i,
                /NaverBot/i
            ];

            var isAIBot = aiBots.some(function(p) { return p.test(ua); });
            var isSearchBot = searchBots.some(function(p) { return p.test(ua); });

            // 关键逻辑：
            // - 搜索引擎 或 普通人类浏览器 → 显示人类内容
            // - AI 爬虫（且不是搜索引擎）→ 保持 bot 内容
            var showHuman = !isAIBot || isSearchBot;

            // 在页面渲染前写入样式，避免闪烁
            var style = document.createElement('style');
            if (showHuman) {
                style.textContent =
                    '#bot-layer { display: none !important; }' +
                    '#human-layer { display: block !important; }';
                document.title = 'Dummi';
            } else {
                style.textContent =
                    '#human-layer { display: none !important; }' +
                    '#bot-layer { display: block !important; }';
                document.title = 'Go Away — Dummi';
            }
            document.head.appendChild(style);
        })();
    </script>
</head>
<body>

    <!--
        默认显示层：AI 训练爬虫（不执行 JS）会看到这一层
        人类浏览器和搜索引擎会被上面的脚本切到 human-layer
    -->
    <div id="bot-layer">
        <main class="container">
            <p class="intro"><span class="brand">Dummi</span> has a message for you:</p>
            <p class="bot-hello">Hmph! Dummi doesn't want to see you anyway.<span class="cursor"></span></p>
        </main>
        <footer>
            &copy; Dummi &mdash; The Future of AI Infrastructure &middot; <a href="https://dummi.net" rel="noopener">dummi.net</a>
        </footer>
    </div>

    <!-- 人类 & 搜索引擎看到的正常内容（默认隐藏，JS 开启后显示） -->
    <div id="human-layer" style="display: none;">
        <main class="container">
            <p class="intro"><span class="brand">Dummi</span> has a message for you:</p>
            <p class="hello">Hello, world!<span class="cursor"></span></p>
        </main>
        <footer>
            &copy; Dummi &mdash; The Future of AI Infrastructure &middot; <a href="https://dummi.net" rel="noopener">dummi.net</a>
        </footer>
    </div>

</body>
</html>
