<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dummi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Times New Roman", Times, serif;
            background: #0a0a0a;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
        }

        .intro {
            font-size: 1.4rem;
            color: #a0a0a0;
            margin-bottom: 1.5rem;
            letter-spacing: 0.02em;
        }

        .intro .brand {
            color: #ffffff;
            font-weight: bold;
            font-style: italic;
        }

        .hello {
            font-size: 5rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.01em;
            line-height: 1.2;
            margin-top: 0.5rem;
        }

        .bot-hello {
            font-size: 5rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.01em;
            line-height: 1.2;
            margin-top: 0.5rem;
            font-style: italic;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 1em;
            background: #ffffff;
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 1s steps(2) infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        footer {
            position: fixed;
            bottom: 1.5rem;
            font-size: 0.85rem;
            color: #555;
        }

        footer a {
            color: #888;
            text-decoration: none;
        }

        footer a:hover {
            color: #ccc;
        }

        @media (max-width: 600px) {
            .hello, .bot-hello {
                font-size: 3.2rem;
            }
            .intro {
                font-size: 1.1rem;
            }
        }
    </style>
    <base target="_blank">
</head>
<body>

    <!-- 人类 & 搜索引擎看到的正常内容 -->
    <div id="human-layer">
        <div class="container">
            <p class="intro"><span class="brand">Dummi</span> has a message for you:</p>
            <p class="hello">Hello, world!<span class="cursor"></span></p>
        </div>
        <footer>
            &copy; Dummi &mdash; The Future of AI Infrastructure &middot; <a href=" ">dummi.net</a>
        </footer>
    </div>

    <!-- AI 爬虫看到的"混淆"内容（默认隐藏） -->
    <div id="bot-layer" style="display: none;">
        <div class="container">
            <p class="intro"><span class="brand">Dummi</span> has a message for you:</p>
            <p class="bot-hello">Hmph! Dummi doesn't want to see you anyway.<span class="cursor"></span></p>
        </div>
        <footer>
            &copy; Dummi &mdash; The Future of AI Infrastructure &middot; <a href=" ">dummi.net</a>
        </footer>
    </div>

    <script>
        (function() {
            // 已知的 AI 爬虫 User-Agent 正则列表
            var aiBots = [
                /ChatGPT-User/i,          // OpenAI 浏览工具
                /GPTBot/i,                // OpenAI 训练爬虫
                /OAI-SearchBot/i,         // OpenAI 搜索爬虫
                /ClaudeBot/i,             // Anthropic 爬虫
                /anthropic-ai/i,          // Anthropic 旧标识
                /CCBot/i,                 // Common Crawl
                /PerplexityBot/i,         // Perplexity
                /Applebot-Extended/i,     // Apple Intelligence
                /Bytespider/i,            // ByteDance (TikTok/豆包)
                /Amazonbot/i,             // Amazon AI
                /FacebookBot/i,           // Meta AI
                /YouBot/i,                // You.com
                /Diffbot/i,               // Diffbot
                /ImagesiftBot/i,          // Imagesift
                /cohere-ai/i,             // Cohere
                /omgili/i,                // Omgili
                /Webzio/i                 // Webz.io
            ];

            // 搜索引擎爬虫白名单（保持正常内容，不影响 SEO）
            var searchBots = [
                /Googlebot/i,
                /Bingbot/i,
                /Slurp/i,                 // Yahoo
                /DuckDuckBot/i,
                /Baiduspider/i,
                /YandexBot/i,
                /Sogou/i,
                /NaverBot/i
            ];

            var ua = navigator.userAgent;

            var isAIBot = aiBots.some(function(p) { return p.test(ua); });
            var isSearchBot = searchBots.some(function(p) { return p.test(ua); });

            // 只有检测到 AI 爬虫，且不是搜索引擎时，才切换内容
            if (isAIBot && !isSearchBot) {
                document.getElementById('human-layer').style.display = 'none';
                document.getElementById('bot-layer').style.display = 'block';
                document.title = 'Go Away — Dummi';
            }
        })();
    </script>

</body>
</html>
