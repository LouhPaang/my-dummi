<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dummi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Times New Roman", Times, serif;
            background: #0a0a0a;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
        }

        .intro {
            font-size: 1.4rem;
            color: #a0a0a0;
            margin-bottom: 1.5rem;
            letter-spacing: 0.02em;
        }

        .intro .brand {
            color: #ffffff;
            font-weight: bold;
            font-style: italic;
        }

        .hello {
            font-size: 5rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.01em;
            line-height: 1.2;
            margin-top: 0.5rem;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 1em;
            background: #ffffff;
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 1s steps(2) infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        footer {
            position: fixed;
            bottom: 1.5rem;
            font-size: 0.85rem;
            color: #555;
        }

        footer a {
            color: #888;
            text-decoration: none;
        }

        footer a:hover {
            color: #ccc;
        }

        @media (max-width: 600px) {
            .hello {
                font-size: 3.2rem;
            }
            .intro {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="intro"><span class="brand">Dummi</span> wants to say to you:</p>
        <p class="hello">Hello, world!<span class="cursor"></span></p>
    </div>
    <footer>
        &copy; Dummi &mdash; The Future of AI Infrastructure &middot; <a href="https://www.dummi.net">dummi.net</a>
    </footer>
</body>
</html>
