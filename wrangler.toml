name = "dummi"
main = "src/index.ts"
compatibility_date = "2026-08-21"

# 可观察性（现在有 Worker 代码了，Logpush / Tail Workers 可用）
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# 静态资源绑定
[[assets]]
directory = "./public"
binding = "ASSETS"
