name = "dummi"
main = "src/index.ts"
compatibility_date = "2026-08-21"

# 可观察性（Wrangler 3.x 兼容格式）
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

# 静态资源绑定（Wrangler 3.x 用单表 [assets]，不是数组 [[assets]]）
[assets]
directory = "./public"
binding = "ASSETS"
